<body class="min-h-screen flex flex-col items-center">
<div class="blob w-[600px] h-[600px] bg-violet-600/40 -top-32 -left-40" style="animation:float 12s ease-in-out infinite"></div>
<div class="blob w-[500px] h-[500px] bg-fuchsia-500/30 top-20 -right-32" style="animation:float 15s ease-in-out infinite reverse"></div>
<div class="blob w-[700px] h-[700px] bg-indigo-500/25 bottom-0 left-1/3" style="animation:float 18s ease-in-out infinite"></div>
<canvas id="confetti" class="fixed inset-0 pointer-events-none z-50 hidden"></canvas>

<header class="w-full max-w-5xl mx-auto px-6 pt-10 pb-6 flex justify-between items-center relative z-10">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-white text-black grid place-items-center font-black text-[18px]">M</div>
    <span class="font-bold tracking-widest text-sm">MBTI • 純粹版</span>
  </div>
  <div class="text-[11px] tracking-[0.2em] opacity-60">20 題 • 約 3 分鐘</div>
</header>

<div id="progress-wrap" class="w-full max-w-5xl mx-auto px-6 relative z-10">
  <div class="flex justify-between text-[11px] tracking-widest opacity-60 mb-2">
    <span id="progress-text">問題 1 / 20</span>
    <span id="progress-dim">外向與內向</span>
  </div>
  <div class="h-[3px] w-full bg-white/10 rounded-full overflow-hidden">
    <div id="progress-bar" class="h-full bg-white progress-glow transition-all duration-500" style="width:5%"></div>
  </div>
</div>

<main class="w-full max-w-5xl mx-auto px-6 py-8 flex-1 relative z-10">
  <div id="quiz" class="">
    <div class="mb-8">
      <div id="q-badge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full glass text-[11px] tracking-[0.15em]">EI • 外向 / 內向</div>
      <h1 id="q-title" class="mt-5 text-[28px] md:text-[40px] font-black leading-tight tracking-tight">週末的理想充電方式是？</h1>
    </div>
    <div class="grid md:grid-cols-2 gap-4 md:gap-5">
      <button id="opt-a" class="glass rounded-[24px] p-6 md:p-8 text-left card-hover group">
        <div class="w-8 h-8 rounded-full bg-white/10 grid place-items-center text-[11px] font-bold mb-5 group-[.card-active]:bg-white group-[.card-active]:text-black transition">A</div>
        <div id="opt-a-label" class="text-[20px] font-bold leading-tight">和朋友出去玩</div>
        <div id="opt-a-sub" class="mt-2 text-[13px] leading-relaxed opacity-60">人越多越有能量</div>
      </button>
      <button id="opt-b" class="glass rounded-[24px] p-6 md:p-8 text-left card-hover group">
        <div class="w-8 h-8 rounded-full bg-white/10 grid place-items-center text-[11px] font-bold mb-5 group-[.card-active]:bg-white group-[.card-active]:text-black transition">B</div>
        <div id="opt-b-label" class="text-[20px] font-bold leading-tight">一個人宅在家</div>
        <div id="opt-b-sub" class="mt-2 text-[13px] leading-relaxed opacity-60">追劇、看書最舒服</div>
      </button>
    </div>
    <div class="mt-8 flex justify-between items-center text-[11px] tracking-widest opacity-40">
      <span>點擊卡片選擇</span><span id="q-count">01 / 20</span>
    </div>
  </div>

  <div id="result" class="hidden">
    <div class="text-center mb-8">
      <div class="inline-flex px-3 py-1 rounded-full glass text-[11px] tracking-[0.2em] mb-4">你的結果</div>
      <div id="r-emoji" class="text-[64px] leading-none mb-3">\uD83C\uDF3F</div>
      <div id="r-type" class="text-[56px] md:text-[72px] font-black tracking-tight leading-none">INFP</div>
      <div id="r-nick" class="mt-2 text-[18px] font-bold tracking-[0.2em] opacity-80">調停者</div>
      <div id="r-intro" class="mt-3 text-[14px] opacity-60 max-w-xl mx-auto leading-relaxed">詩意的理想主義者，忠於內心。</div>
    </div>

    <div class="grid md:grid-cols-[1.2fr_.8fr] gap-4">
      <div class="glass-strong rounded-[24px] p-6 md:p-8">
        <h3 class="text-[11px] tracking-[0.2em] opacity-60 mb-4">維度分析</h3>
        <div id="dims" class="space-y-5"></div>
        <p id="r-desc" class="mt-8 text-[14px] leading-[1.9] opacity-80"></p>
      </div>
      <div class="space-y-4">
        <div class="glass rounded-[20px] p-6">
          <h4 class="text-[11px] tracking-[0.2em] opacity-60 mb-3">核心特質</h4>
          <div id="r-traits" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="glass rounded-[20px] p-5">
            <h4 class="text-[11px] tracking-[0.2em] opacity-60 mb-3">優勢</h4>
            <ul id="r-strengths" class="space-y-1.5 text-[13px] opacity-80"></ul>
          </div>
          <div class="glass rounded-[20px] p-5">
            <h4 class="text-[11px] tracking-[0.2em] opacity-60 mb-3">盲點</h4>
            <ul id="r-weak" class="space-y-1.5 text-[13px] opacity-60"></ul>
          </div>
        </div>
        <div class="glass rounded-[20px] p-5">
          <h4 class="text-[11px] tracking-[0.2em] opacity-60 mb-3">適合職涯</h4>
          <div id="r-careers" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="glass rounded-[20px] p-5">
          <h4 class="text-[11px] tracking-[0.2em] opacity-60 mb-3">同型名人</h4>
          <div id="r-famous" class="flex flex-wrap gap-2"></div>
        </div>
      </div>
    </div>

    <div class="mt-8 flex flex-wrap gap-3 justify-center">
      <button id="restart" class="h-[48px] px-8 rounded-full bg-white text-black font-bold text-[14px] tracking-wide hover:bg-zinc-200 transition">重新測驗</button>
      <button id="share" class="h-[48px] px-8 rounded-full glass font-bold text-[14px] tracking-wide hover:bg-white/10 transition">複製分享連結</button>
    </div>
    <div class="mt-6 text-center text-[11px] opacity-40 tracking-wide">此測驗僅供娛樂參考，非專業心理診斷</div>
  </div>
</main>

<footer class="w-full max-w-5xl mx-auto px-6 pb-10 pt-6 text-[11px] opacity-30 tracking-[0.15em] text-center relative z-10">

</footer>
